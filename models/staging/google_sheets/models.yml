version: 2

models:
  - name: products
    config:
      contract:
        enforced: true
    description: >
      Data about all products in demo.
    
    columns:
      - name: product_id
        data_type: text
        description: >
          UUID for each unique product on platform.
        data_tests:
          - not_null
        constraints:
          - type: not_null

      - name: product_name
        data_type: text
        description: >
          Name of the product.
        constraints:
          - type: not_null

      - name: unit_price_usd
        data_type: real
        description: >
          Price of the product.
        constraints:
          - type: not_null

      - name: inventory
        data_type: number
        description: >
          Amount of the inventory we have for this product.
        constraints:
          - type: not_null

      - name: date_load
        data_type: timestamp_tz
        description: >
          Date that the data was loaded.
        constraints:
          - type: not_null